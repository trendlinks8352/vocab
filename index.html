<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anki 플래시카드</title>
<style>
  :root {
    --bg: #0f0e0c;
    --surface: #1a1917;
    --border: #2e2c28;
    --gold: #c9a84c;
    --gold-dim: #8a6f30;
    --text: #e8e4dc;
    --muted: #7a756c;
    --again: #c0392b;
    --hard: #d35400;
    --good: #27ae60;
    --easy: #2980b9;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Georgia', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .app { width: 100%; max-width: 600px; }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .header h1 {
    font-size: 18px;
    color: var(--gold);
    letter-spacing: 0.05em;
    font-weight: normal;
  }
  .stats {
    display: flex;
    gap: 16px;
    font-size: 13px;
    color: var(--muted);
  }
  .stat span { color: var(--text); font-weight: bold; }

  /* Progress bar */
  .progress-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 32px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--gold);
    transition: width 0.3s ease;
  }

  /* Card */
  .card-wrap {
    perspective: 1000px;
    margin-bottom: 24px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    min-height: 260px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 32px;
    text-align: center;
    position: relative;
    transition: border-color 0.2s;
  }

  .card-label {
    position: absolute;
    top: 16px;
    left: 20px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .card-word {
    font-size: 38px;
    color: var(--gold);
    margin-bottom: 12px;
    line-height: 1.2;
    font-style: italic;
  }

  .card-hint {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .card-meaning {
    font-size: 20px;
    color: var(--text);
    line-height: 1.5;
    display: none;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    width: 100%;
  }

  .card-meaning.visible { display: block; }

  .tts-btn {
    position: absolute;
    top: 14px;
    right: 16px;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tts-btn:hover { border-color: var(--gold); color: var(--gold); }
  .tts-btn.speaking { color: var(--gold); border-color: var(--gold); animation: pulse 0.8s infinite; }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.5 } }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 20px;
  }

  .btn {
    flex: 1;
    max-width: 140px;
    padding: 14px 8px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn:hover { opacity: 0.85; }
  .btn:active { transform: scale(0.97); }

  .btn-show {
    background: var(--gold);
    color: #0f0e0c;
    width: 100%;
    max-width: 100%;
    padding: 16px;
    font-size: 17px;
    margin-bottom: 20px;
  }

  .grade-btns { display: none; }
  .grade-btns.visible { display: flex; gap: 10px; width: 100%; }

  .btn-again { background: var(--again); color: #fff; }
  .btn-hard  { background: var(--hard);  color: #fff; }
  .btn-good  { background: var(--good);  color: #fff; }
  .btn-easy  { background: var(--easy);  color: #fff; }

  .btn-label { font-size: 11px; font-weight: normal; display: block; opacity: 0.8; margin-top: 3px; }

  /* Done screen */
  .done-screen {
    display: none;
    text-align: center;
    padding: 60px 20px;
  }
  .done-screen.visible { display: block; }
  .done-screen h2 { color: var(--gold); font-size: 28px; margin-bottom: 16px; }
  .done-screen p { color: var(--muted); font-size: 15px; line-height: 1.7; }

  .restart-btn {
    margin-top: 28px;
    background: var(--gold);
    color: #0f0e0c;
    border: none;
    border-radius: 8px;
    padding: 14px 32px;
    font-size: 16px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
  }

  /* Footer info */
  .next-info {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 8px;
    min-height: 18px;
  }

  /* Loading */
  .loading {
    color: var(--muted);
    font-size: 15px;
    text-align: center;
    padding: 60px;
  }

  /* Queue info */
  .queue-info {
    display: flex;
    gap: 16px;
    justify-content: center;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .queue-info .new { color: #2980b9; }
  .queue-info .review { color: var(--good); }
  .queue-info .due { color: var(--gold); }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="loading" id="loading">단어 불러오는 중...</div>
</div>

<script>
// ─── SM-2 스케줄러 ───────────────────────────────────────────────
// 등급: 0=Again, 1=Hard, 2=Good, 3=Easy
// intervals: 1일 → 7일 → 14일 → 30일 → easeFactor 곱해서 무한반복
const DB_KEY = 'anki_srs_v1';

function loadDB() {
  try { return JSON.parse(localStorage.getItem(DB_KEY)) || {}; }
  catch { return {}; }
}
function saveDB(db) { localStorage.setItem(DB_KEY, JSON.stringify(db)); }

function getToday() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function daysDiff(a, b) {
  const ms = new Date(b) - new Date(a);
  return Math.round(ms / 86400000);
}

function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d.toISOString().split('T')[0];
}

function scheduleCard(card, grade) {
  // grade: 0(again) 1(hard) 2(good) 3(easy)
  const today = getToday();
  if (!card.interval) card.interval = 0;
  if (!card.easeFactor) card.easeFactor = 2.5;
  if (!card.repetitions) card.repetitions = 0;

  if (grade === 0) {
    // Again: 오늘 다시
    card.interval = 0;
    card.repetitions = 0;
    card.dueDate = today;
  } else if (grade === 1) {
    // Hard: interval 유지 or 1일
    card.interval = Math.max(1, Math.round(card.interval * 1.2));
    card.easeFactor = Math.max(1.3, card.easeFactor - 0.15);
    card.dueDate = addDays(today, card.interval);
  } else if (grade === 2) {
    // Good
    if (card.repetitions === 0) card.interval = 1;
    else if (card.repetitions === 1) card.interval = 7;
    else if (card.repetitions === 2) card.interval = 14;
    else if (card.repetitions === 3) card.interval = 30;
    else card.interval = Math.round(card.interval * card.easeFactor);
    card.repetitions++;
    card.dueDate = addDays(today, card.interval);
  } else {
    // Easy
    if (card.repetitions === 0) card.interval = 4;
    else card.interval = Math.round(card.interval * card.easeFactor * 1.3);
    card.easeFactor = Math.min(3.0, card.easeFactor + 0.15);
    card.repetitions++;
    card.dueDate = addDays(today, card.interval);
  }
  card.lastReview = today;
  return card;
}

function intervalLabel(interval) {
  if (interval === 0) return '오늘 다시';
  if (interval === 1) return '1일 후';
  if (interval < 7) return `${interval}일 후`;
  if (interval < 30) return `${Math.round(interval/7)}주 후`;
  if (interval < 365) return `${Math.round(interval/30)}달 후`;
  return `${Math.round(interval/365)}년 후`;
}

// ─── TTS ─────────────────────────────────────────────────────────
let utterance = null;
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'en-US';
  utterance.rate = 0.88;
  const voices = window.speechSynthesis.getVoices();
  const en = voices.find(v => v.lang.startsWith('en') && v.localService);
  if (en) utterance.voice = en;
  window.speechSynthesis.speak(utterance);
  return utterance;
}

// ─── 메인 앱 ─────────────────────────────────────────────────────
let allCards = [];   // [{word, meaning}]
let queue = [];      // 오늘 학습할 카드 인덱스 배열
let currentIdx = 0;
let db = {};
let sessionStats = { new: 0, review: 0, done: 0 };

async function loadWords() {
  try {
    const r = await fetch('words.txt');
    const text = await r.text();
    allCards = text.trim().split('\n').map((line, i) => {
      const dash = line.indexOf(' - ');
      if (dash === -1) return null;
      return { id: i, word: line.slice(0, dash).trim(), meaning: line.slice(dash + 3).trim() };
    }).filter(Boolean);
  } catch(e) {
    document.getElementById('loading').textContent = '❌ words.txt를 찾을 수 없어요. 같은 폴더에 words.txt를 넣어주세요.';
    return;
  }
  db = loadDB();
  buildQueue();
  render();
}

function buildQueue() {
  const today = getToday();
  const newCards = [];
  const dueCards = [];

  allCards.forEach(c => {
    const rec = db[c.id];
    if (!rec || !rec.dueDate) {
      newCards.push(c.id);
    } else if (rec.dueDate <= today) {
      dueCards.push(c.id);
    }
  });

  // 오늘 큐: due 먼저, 그 다음 new (최대 20개씩)
  queue = [...dueCards, ...newCards];
  sessionStats = { new: newCards.length, review: dueCards.length, done: 0 };
  currentIdx = 0;
}

function currentCard() { return allCards.find(c => c.id === queue[currentIdx]); }

let revealed = false;

function render() {
  const app = document.getElementById('app');

  if (queue.length === 0 || currentIdx >= queue.length) {
    renderDone(app);
    return;
  }

  const card = currentCard();
  const rec = db[card.id] || {};
  const isNew = !rec.dueDate;
  const progress = currentIdx / queue.length * 100;

  app.innerHTML = `
    <div class="header">
      <h1>📚 Anki 플래시카드</h1>
      <div class="stats">
        <div><span id="s-done">${currentIdx}</span>/${queue.length}</div>
      </div>
    </div>

    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>

    <div class="queue-info">
      <span class="new">🆕 신규 ${sessionStats.new}</span>
      <span class="review">🔄 복습 ${sessionStats.review}</span>
    </div>

    <div class="card-wrap">
      <div class="card" id="card">
        <div class="card-label">${isNew ? '🆕 처음' : `🔄 ${intervalLabel(rec.interval || 0)} 복습`}</div>
        <button class="tts-btn" id="tts-btn" onclick="handleTTS()">🔊</button>
        <div class="card-word" id="card-word">${escHtml(card.word)}</div>
        <div class="card-hint">한국어 뜻을 맞혀보세요</div>
        <div class="card-meaning" id="card-meaning">${escHtml(card.meaning)}</div>
      </div>
    </div>

    <button class="btn btn-show" id="show-btn" onclick="revealCard()">뒤집기 &nbsp;↵</button>

    <div class="grade-btns" id="grade-btns">
      <button class="btn btn-again" onclick="grade(0)">
        다시
        <span class="btn-label">오늘</span>
      </button>
      <button class="btn btn-hard" onclick="grade(1)">
        어려움
        <span class="btn-label">${intervalLabel(Math.max(1, Math.round((rec.interval||1) * 1.2)))}</span>
      </button>
      <button class="btn btn-good" onclick="grade(2)">
        보통
        <span class="btn-label">${getGoodLabel(rec)}</span>
      </button>
      <button class="btn btn-easy" onclick="grade(3)">
        쉬움
        <span class="btn-label">${getEasyLabel(rec)}</span>
      </button>
    </div>

    <div class="next-info" id="next-info"></div>
  `;

  revealed = false;

  // 단축키
  document.onkeydown = (e) => {
    if (!revealed && e.key === ' ') { e.preventDefault(); revealCard(); }
    if (revealed) {
      if (e.key === '1') grade(0);
      if (e.key === '2') grade(1);
      if (e.key === '3') grade(2);
      if (e.key === '4') grade(3);
    }
  };

  // 자동 TTS
  setTimeout(() => speak(card.word), 300);
}

function getGoodLabel(rec) {
  const r = rec.repetitions || 0;
  if (r === 0) return '1일 후';
  if (r === 1) return '7일 후';
  if (r === 2) return '14일 후';
  if (r === 3) return '30일 후';
  return intervalLabel(Math.round((rec.interval||1) * (rec.easeFactor||2.5)));
}

function getEasyLabel(rec) {
  const r = rec.repetitions || 0;
  if (r === 0) return '4일 후';
  return intervalLabel(Math.round((rec.interval||1) * (rec.easeFactor||2.5) * 1.3));
}

function revealCard() {
  revealed = true;
  document.getElementById('card-meaning').classList.add('visible');
  document.getElementById('show-btn').style.display = 'none';
  document.getElementById('grade-btns').classList.add('visible');
  document.getElementById('next-info').textContent = '단축키: 1=다시  2=어려움  3=보통  4=쉬움';
  speak(currentCard().word);
}

function grade(g) {
  const card = currentCard();
  let rec = db[card.id] || {};
  rec = scheduleCard(rec, g);
  db[card.id] = rec;
  saveDB(db);

  currentIdx++;
  render();
}

function handleTTS() {
  const card = currentCard();
  if (!card) return;
  const btn = document.getElementById('tts-btn');
  if (btn) btn.classList.add('speaking');
  const u = speak(card.word);
  if (u) u.onend = () => { if (btn) btn.classList.remove('speaking'); };
}

function renderDone(app) {
  app.innerHTML = `
    <div class="done-screen visible">
      <h2>🎉 오늘 학습 완료!</h2>
      <p>오늘 세션을 마쳤어요.<br>
      복습 카드는 지정된 날짜에 다시 나타나요.<br><br>
      내일 또 돌아와서 꾸준히 쌓아가자! 💪</p>
      <button class="restart-btn" onclick="location.reload()">처음부터 다시</button>
    </div>
  `;
  document.onkeydown = null;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 음성 로드 후 시작
window.speechSynthesis.onvoiceschanged = () => {};
loadWords();
</script>
</body>
</html>
